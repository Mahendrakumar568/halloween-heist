<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0b14">
<meta name="description" content="Operation: Best Human. A Halloween Heist detective game starring Amy Santiago. Interrogate the squad, catch the lies and find the cummerbund before midnight.">
<title>Operation: Best Human | A Halloween Heist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Creepster&family=Inter:wght@400;500;600;700;800&family=Special+Elite&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="preload" as="image" href="Images/web/bullpen.webp">
</head>
<body>
<div id="app">
  <div id="frame">
    <main id="stage" aria-label="Game scene">
      <div class="bg" id="bgA"></div>
      <div class="bg" id="bgB"></div>
      <div id="shade"></div>
      <canvas id="fx" aria-hidden="true"></canvas>
      <div id="hotspots" aria-label="Things you can investigate"></div>
      <div id="squad" aria-label="The squad" hidden></div>

      <header id="hud" hidden>
        <div class="hud-left">
          <div class="chapter" id="hudChapter">Chapter 2</div>
          <div class="location" id="hudLocation">Bullpen</div>
        </div>
        <div class="clock" id="clock" title="The heist ends at midnight">
          <div class="clock-time"><span id="clockTime">11:00</span><small>PM</small></div>
          <div class="clock-bar"><i id="clockFill"></i></div>
          <div class="clock-label" id="clockLabel">60 min to midnight</div>
        </div>
        <nav class="hud-right" aria-label="Game menu">
          <button class="hud-btn" id="btnCase" title="Case file (C)"><svg viewBox="0 0 24 24"><path d="M3 7h6l2 2h10v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z"/><path d="M3 7V5a1 1 0 0 1 1-1h5l2 2"/></svg><span>Case file</span><b class="badge" id="caseBadge" hidden>0</b></button>
          <button class="hud-btn" id="btnMap" title="Travel (M)"><svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg><span>Travel</span></button>
          <button class="hud-btn" id="btnHint" title="Hint (costs 2 minutes)"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg><span>Hint</span></button>
          <button class="hud-btn" id="btnMenu" title="Menu (Esc)"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg><span>Menu</span></button>
        </nav>
      </header>

      <div id="objective" hidden><span class="obj-tag">Objective</span><span id="objectiveText"></span></div>
      <button id="revealBtn" hidden title="Show everything you can click (Tab)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/></svg></button>
      <div id="cinema"></div>
      <div id="flash"></div>
    </main>

    <section id="dialogue" hidden aria-live="polite">
      <div class="portrait" id="portrait"><img id="portraitImg" alt=""></div>
      <div class="dlg-body">
        <div class="nameplate" id="nameplate"></div>
        <div class="dlg-text" id="dlgText"></div>
        <div class="choices" id="choices"></div>
        <div class="advance" id="advance" aria-hidden="true">▼</div>
      </div>
    </section>
  </div>

  <!-- Title screen -->
  <section id="title" class="screen">
    <div class="title-bg"></div>
    <canvas id="titleFx" aria-hidden="true"></canvas>
    <div class="title-inner">
      <div class="title-kicker">The 99th Precinct presents</div>
      <h1 class="title-logo"><span class="t1">Operation</span><span class="t2">Best Human</span></h1>
      <div class="title-sub">A Halloween Heist detective game</div>
      <div class="title-menu" id="titleMenu">
        <button class="btn primary" id="btnNew">New case</button>
        <button class="btn" id="btnContinue" hidden>Continue</button>
        <button class="btn" id="btnAch">Achievements</button>
        <button class="btn" id="btnSettings">Settings</button>
        <button class="btn" id="btnHow">How to play</button>
      </div>
      <div class="title-foot">Best with sound on · <kbd>Space</kbd> advance · <kbd>C</kbd> case file · <kbd>M</kbd> travel · <kbd>Tab</kbd> show clues</div>
    </div>
  </section>

  <!-- Generic modal -->
  <div id="modal" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card" id="modalCard">
      <header class="modal-head"><h2 id="modalTitle"></h2><button class="x" id="modalClose" aria-label="Close">✕</button></header>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div id="toasts" aria-live="polite"></div>
  <div id="fade"></div>
  <div id="rotate-hint">Turn your phone sideways for the best view</div>
</div>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
